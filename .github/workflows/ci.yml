name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    # macos-latest, not ubuntu — the native side (macos_input_view.rs, `#[cfg(target_os =
    # "macos")]` push-to-talk/keyboard-shortcut code) only compiles for macOS, matching
    # release.yml's own runner choice.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Also the "test" step for the frontend: this project has no separate test suite, so
      # `tsc`'s type-checking (run as part of `npm run build`) is what catches frontend bugs
      # in CI. Must run before any Rust step below — `src-tauri/build.rs` embeds `../dist`
      # (`rust_embed`, see lib.rs), so cargo can't build until this exists.
      - name: Build frontend
        run: npm run build

      - name: Lint (clippy)
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features

      - name: Test (Rust)
        working-directory: src-tauri
        run: cargo test --all-features

      - name: Build (Rust)
        working-directory: src-tauri
        run: cargo build --all-features
