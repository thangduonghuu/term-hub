name: PR Description Bot

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  describe-pr:
    if: github.event.pull_request.body == '' || github.event.pull_request.body == null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build diff summary
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          STAT_EOF="STAT_EOF_${GITHUB_RUN_ID}_${GITHUB_JOB}_$RANDOM"
          {
            echo "stat<<$STAT_EOF"
            git diff --stat "$BASE_SHA" "$HEAD_SHA" -- . ':(exclude)pnpm-lock.yaml' ':(exclude)**/pnpm-lock.yaml'
            echo "$STAT_EOF"
          } >> "$GITHUB_OUTPUT"

          PATCH_EOF="PATCH_EOF_${GITHUB_RUN_ID}_${GITHUB_JOB}_$RANDOM"
          {
            echo "patch<<$PATCH_EOF"
            git diff "$BASE_SHA" "$HEAD_SHA" -- . ':(exclude)pnpm-lock.yaml' ':(exclude)**/pnpm-lock.yaml' | head -c 12000
            echo ""
            echo "$PATCH_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate description
        id: ai
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-chat
          DIFF_STAT: ${{ steps.diff.outputs.stat }}
          DIFF_PATCH: ${{ steps.diff.outputs.patch }}
        run: |
          set -euo pipefail

          SYSTEM_PROMPT='You are an assistant that writes Pull Request descriptions for a software project.
          Based on the list of changed files (git diff --stat) and the provided diff content,
          write a PR description in English, in Markdown format, including:
          1. A short summary paragraph (2-3 sentences) about the purpose/content of the changes.
          2. A "### Key Changes" section listing bullet points per file or related file group.
          Return only the Markdown content of the description, with no greeting and no extra explanation.'

          USER_PROMPT="List of changed files:
          ${DIFF_STAT}

          Diff content (may be truncated if too long):
          ${DIFF_PATCH}"

          # Build the request body with jq so the prompt text is JSON-escaped safely.
          REQ_BODY="$(jq -n \
            --arg model "$DEEPSEEK_MODEL" \
            --arg system "$SYSTEM_PROMPT" \
            --arg user "$USER_PROMPT" \
            '{
              model: $model,
              max_tokens: 700,
              stream: false,
              messages: [
                {role: "system", content: $system},
                {role: "user", content: $user}
              ]
            }')"

          RESPONSE="$(curl -sS --fail-with-body \
            https://api.deepseek.com/chat/completions \
            -H "Authorization: Bearer ${DEEPSEEK_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$REQ_BODY")"

          BODY="$(printf '%s' "$RESPONSE" | jq -r '.choices[0].message.content // empty')"
          if [ -z "$BODY" ]; then
            echo "DeepSeek returned no content. Raw response:" >&2
            printf '%s\n' "$RESPONSE" >&2
            exit 1
          fi

          RESP_EOF="RESP_EOF_${GITHUB_RUN_ID}_${GITHUB_JOB}_$RANDOM"
          {
            echo "response<<$RESP_EOF"
            printf '%s\n' "$BODY"
            echo "$RESP_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update PR description
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AI_BODY: ${{ steps.ai.outputs.response }}
        run: |
          {
            echo "$AI_BODY"
            echo ""
            echo "---"
            echo "_This description was automatically generated by the DeepSeek API when the PR was opened._"
          } > pr-body.md
          gh pr edit "$PR_NUMBER" --body-file pr-body.md
