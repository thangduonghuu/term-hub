[package]
name = "termhub"
version = "0.1.0"
description = "TermHub keeps a persistent list of terminal sessions and opens each one in a real external terminal app (iTerm, Warp, Windows Terminal, etc.), built for running multiple AI coding agents (Claude Code, Codex, etc.) in parallel. Rename, persist, and reopen sessions, and track their token usage. Tauri + React, MIT licensed."
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "termhub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
winit = "0.30"
wry = { version = "0.55", features = ["protocol"] }
rust-embed = "8"
wgpu = "25"
pollster = "0.4"
alacritty_terminal = "0.26"
glyphon = "0.9"
swash = { version = "0.2", features = ["render"] }
dirs = "6"
raw-window-handle = "0.6"
arboard = "3"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSAccessibilityConstants", "NSScreen", "NSPasteboard"] }
objc2-foundation = { version = "0.2", features = ["NSURL", "NSString"] }
objc2-speech = { version = "0.3", default-features = false, features = [
    "std", "block2", "SFSpeechRecognizer", "SFSpeechRecognitionRequest", "SFSpeechRecognitionResult",
    "SFSpeechRecognitionTask", "SFTranscription", "SFTranscriptionSegment", "SFErrors",
    "objc2-avf-audio",
] }
objc2-avf-audio = { version = "0.3", default-features = false, features = [
    "std", "block2", "AVAudioEngine", "AVAudioNode", "AVAudioIONode", "AVAudioFormat",
    "AVAudioBuffer", "AVAudioTypes", "AVAudioTime",
] }
# `objc2-speech`/`objc2-avf-audio` 0.3 are built against objc2 0.6 (Retained/Allocated/etc. from
# that version), a full major bump from the `objc2 = "0.5"` this crate otherwise uses for its own
# AppKit interop (macos.rs/macos_input_view.rs) — Cargo happily resolves both simultaneously
# since 0.x versions with different minors are semver-incompatible anyway, but that means the two
# `Retained<T>` types are NOT interchangeable, so `speech.rs` (which only talks to the Speech/
# AVFAudio APIs) sticks to this renamed import rather than the plain `objc2` used everywhere else.
objc2-speech-runtime = { package = "objc2", version = "0.6", default-features = false, features = ["std"] }
objc2-speech-foundation = { package = "objc2-foundation", version = "0.3", default-features = false, features = [
    "std", "NSError", "NSString",
] }
block2 = "0.6"

